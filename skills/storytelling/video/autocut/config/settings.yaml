# autocut 全局设置。环境变量优先级更高；个人修改写进同目录 settings.local.yaml（不提交）。
# 密钥一律走环境变量，不要写在这里。

# 项目根目录：`autocut new xxx` 会建在这里。为空则用 ~/Videos/vcut-projects
# 环境变量：VCUT_PROJECTS_ROOT
projects_root: ""

# 默认 AI 后端：none（离线启发式）| dashscope（阿里云百炼）| gemini | ollama（本地）
# 环境变量：VCUT_BACKEND；项目 project.yaml 里的 backend 字段优先
backend: none

backends:
  dashscope:
    # 新版控制台使用业务空间专属地址：https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    # 设置环境变量 DASHSCOPE_WORKSPACE_ID 后自动拼接；也可直接设置 DASHSCOPE_BASE_URL。
    # 都没设置时使用旧通用地址 https://dashscope.aliyuncs.com/compatible-mode/v1
    region: cn-beijing
    vision_model: qwen3-vl-flash      # 逐镜头看图，便宜
    text_model: qwen3-vl-plus         # 生成剪辑方案/拍摄清单
    api_key_env: DASHSCOPE_API_KEY
    json_mode: true
  gemini:
    base_url: https://generativelanguage.googleapis.com
    vision_model: gemini-3.8-flash
    text_model: gemini-3.8-flash
    api_key_env: GEMINI_API_KEY
    # frames：发关键帧（便宜）；video：上传低清代理视频（更懂动作/声音，较贵）
    vision_mode: frames
  ollama:
    base_url: http://localhost:11434/v1   # 环境变量 OLLAMA_HOST 可覆盖主机
    vision_model: qwen3-vl:8b-instruct    # 约 6GB，12GB 显存够用；显存紧张用 qwen2.5vl:7b
    text_model: qwen3-vl:8b-instruct
    json_mode: true

analysis:
  scene_threshold: 0.32        # ffmpeg 场景切换阈值，越小切得越碎
  max_shot_seconds: 8          # 长镜头按此长度切成子镜头，便于挑选
  min_shot_seconds: 0.6
  sample_fps: 3                # 画质分析采样帧率
  keyframe_width: 640
  vision_image_width: 512      # 发给模型的图片宽度（省钱）
  vision_batch: 6              # 每次请求最多几个镜头
  silence_db: -35
  hwaccel: auto                # ffmpeg 解码硬件加速：auto | cuda | none

asr:
  enabled: true
  # builtin：进程内 faster-whisper（模型常驻、VAD、CUDA 选卡，批量素材更快）
  # toolkit：调用 video/scripts/transcribe.py（与 `run transcribe` 同一实现，默认只用本地模型，逐文件加载更慢）
  # 已经用 `run transcribe` 转写过的素材，可用 `autocut import-transcript` 导入，analyze 会直接复用。
  engine: builtin
  toolkit_model: ""            # engine: toolkit 时的模型名或本地目录；留空用 cpu_model
  allow_download: false        # engine: toolkit 时是否允许下载模型（对应 transcribe.py --download）
  model: large-v3-turbo        # 也可以填本地模型文件夹路径；CPU 环境会自动降级为 cpu_model
  cpu_model: small
  language: auto               # auto | zh | en
  device: auto                 # auto | cuda | cpu
  device_index: 0              # 多卡时选哪张（0 = 第一张）
  # 首次运行会从 HuggingFace 下载模型；国内网络建议用镜像（或设环境变量 HF_ENDPOINT）
  hf_endpoint: ""              # 例：https://hf-mirror.com
  initial_prompt: "以下是普通话的句子，使用简体中文，带标点。"

render:
  encoder: auto                # auto | h264_nvenc | libx264 | hevc_nvenc
  crf: 20
  nvenc_cq: 23
  preset_x264: medium
  audio_bitrate: 192k
  loudness_lufs: -14
  subtitles: burn              # burn（烧录）| sidecar（只出 .srt）| both
  reframe: auto                # auto | crop | blur_pad | pad   （画幅不一致且未走下面 reframe.vertical 时的处理）
  fx: true                     # v2 特效引擎（运镜/特效/自定义转场/360 重构图）；false 或 `autocut render --no-fx` 关闭
  equirect_width: 5760         # 360 全景解码上限宽度（越大越清晰越慢；预览 --quick 用 2880）
  fx_threads: 0                # 特效引擎 OpenCV 线程数，0 = 自动
  minterpolate: false          # 变速慢动作默认用帧混合；true 时改用 ffmpeg minterpolate 光流插帧（慢很多）

# 主体跟踪（360 自动跟随、横转竖主体构图）
track:
  detector: auto               # auto | yolo | yunet | haar | motion | none
  # YOLO 系列 ONNX 模型路径（需 `pip install onnxruntime` 或 OpenCV DNN）。权重不随仓库提供，请自行选择并核对许可
  # （Ultralytics YOLOv8/11 权重为 AGPL-3.0）。
  # 留空则依次尝试 YuNet 人脸 → Haar/HOG（OpenCV 4）→ 运动检测 → 固定朝向
  yolo_model: ""
  yunet_model: ""              # 留空 = 模型目录里的 face_detection_yunet_2023mar.onnx（`autocut models fetch yunet` 下载）
  conf: 0.35
  sample_fps: 3                # 检测采样帧率（之后平滑插值；360 最多 3）
  max_slew_deg: 90             # 360 跟随每秒最大转向角度（越小越稳）

# 音效（自动放在转场/卡点/定格上）。library 目录下按子文件夹分类：
#   whoosh/ hit/ riser/ glitch/ shutter/ pop/ swish/   （wav/mp3/flac/ogg）
# 留空或某类为空时自动合成程序化音效。环境变量 VCUT_SFX_LIBRARY 优先。
sfx:
  enabled: true
  library: ""
  volume: 0.55

music:
  library: ""                  # 本地曲库目录，按文件夹名/文件名/ library.yaml 标签识别情绪
  volume: 0.22
  duck: true

jianying:
  # 为空时自动用 %LOCALAPPDATA%\JianyingPro\User Data\Projects\com.lveditor.draft
  drafts_dir: ""

# 横屏素材 → 竖屏成片（16:9 → 9:16）的重构图，每个镜头只决定一次、镜头内不切换
reframe:
  vertical: smart        # smart（默认：主体放得进竖屏窗口就平滑跟随，否则整幅+模糊背景）| fit_blur | fit_bars | crop（旧：紧裁切）
  loose: 1.25            # 跟随窗口 = 9:16 宽度 × loose（>1 更宽松，上下少量模糊填充）
  fit_zoom: 1.0          # fit_blur 时画面轻微放大（1.0–1.15）
  dead_zone: 0.12        # 主体偏离窗口中心超过窗口宽度的这个比例才移动（防抖）
  sample_fps: 2.0
  bg_blur: 0.06
  bg_dim: 0.55

