id: energetic
name: 活力快剪
aliases: [活力, 快剪, 活力快剪, energetic, fast]
description: 快节奏卡点、闪白/滑动转场、饱和度高，适合活动现场和短视频平台。
pacing: {avg_shot: 1.3, min_shot: 0.5, max_shot: 2.5, hook_shot: 0.6}
transitions:
  within: [cut, cut, cut, slideleft, cut, zoomin]
  section: [fadewhite, slideup, zoomin]
  duration: 0.25
effects:
  zoom_prob: 0.35
  speed_ramp: true
beat_sync: true
subtitle: {size: 0.056, primary: "#FFFFFF", outline: "#000000", outline_w: 3.5, bold: true, margin_v: 0.12}
title: {size: 0.1, primary: "#FFE14D", accent: "#FF4D6D", bold: true}
color:
  filter: "eq=contrast=1.1:saturation=1.25:brightness=0.01"
  lut: ""
music: {mood: [活力, 动感, 流行, 鼓点, upbeat, energetic, pop], volume: 0.26}
# ---- v2：运镜 / 特效 / 音效 / 文字动画 调色板 ----
motion:
  intensity: 0.8
  move_prob: 0.6
  moves_2d:
    default: [push_in, pull_out, pan]
    action: [shake, push_in]
    talking_head: [subject]
  punch: {prob: 0.5, at: beats, every: 2, roles: [action, crowd, broll, pov, establishing]}
  shake: 0.2
  moves_360: {hook: planet_intro, establishing: [orbit, tiny_planet], selfie: hero, default: follow}
  whip360: true
  ramp: {prob: 0.4, roles: [action, pov, crowd, build], interp: blend}
  freeze: {prob: 0.15, max: 1, callout: false}
  pip: false
fx:
  look: []
  accents: [flash, speed_lines]
  accent_prob: 0.4
  accent_dur: 0.35
  peak: [speed_lines]
  beat_flash: {at: downbeats, strength: 0.4, every: 2}
hud:   # ff-tracking 风格 HUD（MIT 移植）。默认关闭以保持原有输出：tracker.prob 调到 0.3~0.6、terminal.enabled 改 true 即启用；整套预设见 style tracker_hud
  tracker:
    prob: 0.0
    roles: [product, detail, demo, action]
    min_dur: 1.8
    max_clips: 2
    lock: beat
    lens: {palette: amber, palette_mix: 0.35, dof: 0.5, bloom: 0.5, led: 0.0}
  sfx: true
sfx: {transition: whoosh, custom_transition: whoosh, section: [riser, hit], flash: hit, glitch: glitch, freeze: shutter, volume: 0.5}
text_anims: {title: stamp, section: pop, lower_third: slide_up, cta: pop, callout: pop, subtitle: ""}
progress: {enabled: false}
jianying:
  transition: 闪白
  filter: 高清4K电影
  filter_intensity: 50
  intro: 动感放大
  text_intro: 弹入
  scene_effects: {flash: 闪白, speed_lines: 冲刺, shake: 抖动, rgb_split: 色差}
