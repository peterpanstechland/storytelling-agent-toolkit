id: beat_max
name: 极致卡点
aliases: [卡点, 极致卡点, 踩点, beat, beatsync, beat_max, 快闪]
description: 每个剪辑点踩在节拍上，重拍白闪 + 卡点放大 + 抖动，甩镜/旋转/推镜穿越转场 + 音效；适合活动燃剪、短视频开头。
pacing: {avg_shot: 0.9, min_shot: 0.45, max_shot: 1.8, hook_shot: 0.5}
transitions:
  within: [cut, cut, whip_left, cut, spin, cut, zoom_through, cut, whip_right]
  section: [flash, zoom_through, spin_ccw]
  duration: 0.25
effects: {zoom_prob: 0.0, speed_ramp: false}
beat_sync: true
motion:
  intensity: 1.0
  move_prob: 0.6
  moves_2d:
    default: [push_in, pull_out, pan]
    action: [shake, push_in]
    crowd: [pan, push_in]
    talking_head: [subject]
  punch: {prob: 0.85, at: beats, every: 1, roles: [action, broll, crowd, establishing, pov, build, product, detail, selfie]}
  shake: 0.35
  moves_360: {hook: planet_intro, establishing: [tiny_planet, orbit], selfie: hero, crowd: orbit, default: follow}
  whip360: true
  ramp: {prob: 0.5, roles: [action, pov, crowd, build], interp: blend}
  freeze: {prob: 0.2, max: 1, callout: false}
  pip: false
fx:
  look: [{type: vignette, intensity: 0.3}]
  accents: [flash, rgb_split, speed_lines]
  accent_prob: 0.5
  accent_dur: 0.35
  peak: [speed_lines, flare]
  beat_flash: {at: downbeats, strength: 0.6, every: 1}
hud:   # ff-tracking 风格 HUD（MIT 移植）。默认关闭以保持原有输出：tracker.prob 调到 0.3~0.6、terminal.enabled 改 true 即启用；整套预设见 style tracker_hud
  tracker:
    prob: 0.0
    roles: [product, detail, build, demo, action]
    min_dur: 1.6
    max_clips: 2
    lock: beat
    lens: {}
  sfx: true
sfx: {transition: whoosh, custom_transition: whoosh, section: [riser, hit], flash: hit, glitch: glitch, freeze: shutter, volume: 0.6}
text_anims: {title: stamp, section: pop, lower_third: slide_up, cta: stamp, callout: pop, subtitle: pop}
progress: {enabled: false}
subtitle: {size: 0.058, primary: "#FFFFFF", outline: "#000000", outline_w: 4, bold: true, margin_v: 0.12}
title: {size: 0.11, primary: "#FFE14D", accent: "#FF4D6D", bold: true}
color:
  filter: "eq=contrast=1.12:saturation=1.3:brightness=0.01"
  lut: ""
music: {mood: [卡点, 鼓点, 燃, 动感, 电子, 活力, upbeat, edm, trap, phonk, energetic], volume: 0.3}
jianying:
  transition: 闪白
  filter: 高清4K电影
  filter_intensity: 60
  intro: 动感放大
  outro: 放大
  text_intro: 弹入
  text_loop: 跳动
  scene_effects: {flash: 闪白, rgb_split: 色差, speed_lines: 冲刺, shake: 闪光震动, flare: 闪动光斑, glitch: 故障}
