id: premium_film
name: 高级胶片感
aliases: [高级感, 电影感, 高级胶片, premium, premium_film, 活动, 发布会, vlog]
description: 活动 / vlog / 品牌回顾的「高级感」预设：胶片模拟（柯达暖调 + halation + 亮度加权颗粒）、变形宽银幕拉丝光、GL Transitions 级转场（穿越缩放 / 交叉扭曲 / 胶片烧灼）。全部为本地 CPU 渲染。
pacing: {avg_shot: 2.8, min_shot: 1.2, max_shot: 5.0, hook_shot: 1.4}
transitions:
  within: [cut, cut, cut, fade, gl_ripple]
  section: [gl_cross_zoom, gl_film_burn, gl_crosswarp, gl_dreamy_zoom]
  duration: 0.7
effects: {zoom_prob: 0.2, speed_ramp: false}
motion:
  intensity: 0.5
  move_prob: 0.6
  moves_2d:
    default: [push_in, pan, pull_out]
    talking_head: [subject]
  punch: {prob: 0.0}
  shake: 0.0
  moves_360: {hook: tiny_planet, establishing: orbit, selfie: hero, default: follow}
  whip360: false
  ramp: {prob: 0.15, roles: [action, pov], interp: blend}
  freeze: {prob: 0.2, max: 2, callout: false}
  pip: false
fx:
  look: [{type: film_stock, intensity: 0.85, params: {stock: kodak_warm}}, {type: vignette, intensity: 0.35}]
  accents: [anamorphic, light_leak]
  accent_prob: 0.35
  accent_dur: 1.6
  peak: [anamorphic]
  beat_flash: {at: none}
sfx: {transition: swish, custom_transition: whoosh, section: [whoosh], flash: shutter, glitch: glitch, freeze: shutter, volume: 0.4}
text_anims: {title: highlight_box, section: slide_up, lower_third: fade, cta: fade, callout: fade, subtitle: ""}
progress: {enabled: false}
subtitle: {size: 0.046, primary: "#FFF6E0", outline: "#2A1E14", outline_w: 2, bold: false, margin_v: 0.07}
title: {size: 0.08, primary: "#FFF1D6", accent: "#E8A25B", bold: true}
color: {filter: "", lut: ""}
music: {mood: [电影, 治愈, cinematic, 温暖, ambient, 钢琴], volume: 0.22}
jianying:
  transition: 叠化
  filter: 情绪电影
  filter_intensity: 55
  intro: 渐显
  outro: 渐隐
  text_intro: 向上滑动
  scene_effects: {light_leak: 胶片漏光, grain: 胶片, vignette: 暗角}
