id: film_retro
name: 胶片复古
aliases: [胶片, 复古, 胶片复古, 港风, VHS, film, retro, vintage]
description: 胶片颗粒 + 片门抖动、漏光、暗角，局部 VHS 录像带质感，打字机字幕；适合旅行/日常/活动回忆。
pacing: {avg_shot: 2.8, min_shot: 1.2, max_shot: 5.0, hook_shot: 1.5}
transitions:
  within: [cut, cut, light_leak, cut, fade]
  section: [light_leak, fadewhite, flash]
  duration: 0.5
effects: {zoom_prob: 0.0, speed_ramp: false}
beat_sync: false
motion:
  intensity: 0.5
  move_prob: 0.6
  moves_2d:
    default: [push_in, pan, pull_out]
    talking_head: [subject]
  punch: {prob: 0.0}
  shake: 0.15
  moves_360: {hook: tiny_planet, establishing: [tiny_planet, orbit], selfie: hero, default: follow}
  whip360: false
  ramp: {prob: 0.2, roles: [action, pov], interp: blend}
  freeze: {prob: 0.25, max: 2, callout: false}
  pip: false
fx:
  look: [{type: grain, intensity: 0.6}, {type: vignette, intensity: 0.55}]
  accents: [light_leak, vhs]
  accent_prob: 0.4
  accent_dur: 1.4
  peak: [light_leak]
  beat_flash: {at: none}
sfx: {transition: swish, custom_transition: swish, section: [shutter], flash: shutter, glitch: glitch, freeze: shutter, volume: 0.45}
text_anims: {title: typewriter, section: typewriter, lower_third: fade, cta: fade, callout: fade, subtitle: ""}
progress: {enabled: false}
subtitle: {size: 0.046, primary: "#FFF6E0", outline: "#3A2A1A", outline_w: 2, bold: false, margin_v: 0.07}
title: {size: 0.08, primary: "#FFE9C2", accent: "#E8A25B", bold: false}
color:
  filter: "eq=contrast=1.05:saturation=0.82:gamma=1.03,colorbalance=rs=0.05:gs=0.02:bs=-0.06:rh=0.04:bh=-0.05,colorlevels=romin=0.05:gomin=0.04:bomin=0.06:romax=0.96:gomax=0.95:bomax=0.90"
  lut: ""
music: {mood: [复古, 怀旧, 城市流行, 爵士, lofi, retro, vintage, citypop, jazz], volume: 0.24}
jianying:
  transition: 叠化
  filter: 港风
  filter_intensity: 65
  intro: 渐显
  outro: 渐隐
  text_intro: 打字机_I
  scene_effects: {grain: 胶片, light_leak: 胶片漏光, vhs: 录像带, shake: 胶片抖动, vignette: 暗角, flash: 闪白}
